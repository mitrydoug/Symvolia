services:
  meilisearch:
    image: getmeili/meilisearch:v1.13
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "dev-master-key"
      MEILI_ENV: "development"
    tmpfs:
      - /meili_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 15s
      retries: 3
      timeout: 2s
      start_period: 10s
