<svg xmlns="http://www.w3.org/2000/svg" viewBox="82 22 246 246" role="img" aria-labelledby="title desc">
  <title id="title">Symvolia — River Confluence Rounded Square</title>
  <desc id="desc">Red and blue rivers merge into a purple trunk within a rounded navy square with gently bulging sides.</desc>
  <defs>
    <linearGradient id="red-source" gradientUnits="userSpaceOnUse" x1="138" y1="35" x2="244" y2="190"><stop offset="0" stop-color="#f0444f"/><stop offset="0.48" stop-color="#d94768" stop-opacity="0.9"/><stop offset="0.78" stop-color="#a34286" stop-opacity="0.45"/><stop offset="1" stop-color="#8b55c7" stop-opacity="0"/></linearGradient>
    <linearGradient id="blue-source" gradientUnits="userSpaceOnUse" x1="322" y1="35" x2="254" y2="185"><stop offset="0" stop-color="#2474e8"/><stop offset="0.48" stop-color="#3d64d2" stop-opacity="0.9"/><stop offset="0.78" stop-color="#5354b5" stop-opacity="0.45"/><stop offset="1" stop-color="#8b55c7" stop-opacity="0"/></linearGradient>
    <path id="rounded-square" d="M 145,30 C 120,30 101,39 94,58 C 88,77 86,111 86,145 C 86,179 88,213 94,232 C 101,251 120,260 145,260 C 178,264 232,264 265,260 C 290,260 309,251 316,232 C 322,213 324,179 324,145 C 324,111 322,77 316,58 C 309,39 290,30 265,30 C 232,26 178,26 145,30 Z"/>
    <clipPath id="rounded-square-boundary"><use href="#rounded-square"/></clipPath>
    <path id="northeastern-river" d="M 312,32 L 328,32 C 321,64 301,83 277,102 C 255,119 245,133 249,153 C 252,167 258,175 266,185 C 258,190 250,198 238,207 C 230,195 225,175 224,154 C 220,122 234,101 262,80 C 287,61 305,47 312,32 Z"/>
    <path id="main-river" d="M 150,10 C 150,55 136,94 152,116 C 162,129 176,136 191,143 C 219,154 246,164 266,185 C 288,216 293,250 293,290 L 248,290 C 248,251 252,222 238,207 C 222,191 201,182 175,171 C 155,161 137,150 127,134 C 108,105 119,49 126,10 Z"/>
    <mask id="main-river-wide" maskUnits="userSpaceOnUse" x="70" y="0" width="280" height="300"><use href="#main-river" fill="white" stroke="white" stroke-width="16" stroke-linejoin="round"/></mask>
    <mask id="northeastern-river-wide" maskUnits="userSpaceOnUse" x="70" y="0" width="280" height="300"><use href="#northeastern-river" fill="white" stroke="white" stroke-width="16" stroke-linejoin="round"/></mask>
  </defs>
  <use href="#rounded-square" fill="#10283f"/>
  <g clip-path="url(#rounded-square-boundary)">
    <g fill="#8b55c7" stroke="#8b55c7" stroke-width="16" stroke-linejoin="round"><use href="#northeastern-river"/><use href="#main-river"/></g>
    <rect x="70" y="0" width="280" height="300" fill="url(#red-source)" mask="url(#main-river-wide)"/>
    <rect x="70" y="0" width="280" height="300" fill="url(#blue-source)" mask="url(#northeastern-river-wide)"/>
  </g>
  <use href="#rounded-square" fill="none" stroke="#7892aa" stroke-width="2.5"/>
</svg>
