name: Reconcile smart contracts

on:
  push:
    branches:
      - develop
      - release

  workflow_dispatch:
    inputs:
      target:
        description: "Contract reconciliation target"
        required: true
        type: choice
        options:
          - development
          - production

permissions:
  contents: write

concurrency:
  group: contract-reconcile-${{ github.ref_name || inputs.target }}
  cancel-in-progress: false

jobs:
  reconcile-development:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'development')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    env:
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      BASE_SEPOLIA_DEPLOYER_PRIVATE_KEY: ${{ secrets.BASE_SEPOLIA_DEPLOYER_PRIVATE_KEY }}
      DEPLOYMENT_PROFILE: base-sepolia
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile --build-profile production

      - name: Reconcile Base Sepolia forums
        run: npx hardhat run scripts/reconcile-forums.ts --network base_sepolia

      - name: Generate deployment artifacts
        run: |
          node ../scripts/generate-deployment-artifacts.mjs base_sepolia
          node ../scripts/generate-backend-env-examples.mjs

      - name: Commit reconciled deployment state
        run: |
          git config user.name "smart-contract-deployer"
          git config user.email "smart-contract-deployer@symvolia.org"

          git add ../deployments/base_sepolia.json
          git add ../frontend/src/contracts/networks/base_sepolia.ts
          git add ../deploy/env/*.env.example

          if git diff --cached --quiet; then
            echo "No Base Sepolia forum reconciliation changes."
          else
            git commit -m "chore: reconcile Base Sepolia forum deployments"
            git push
          fi

  reconcile-production:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      BASE_DEPLOYER_PRIVATE_KEY: ${{ secrets.BASE_DEPLOYER_PRIVATE_KEY }}
      DEPLOYMENT_PROFILE: base
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile --build-profile production

      - name: Check deployer balance
        run: npx tsx scripts/check-balance.ts base

      - name: Reconcile Base Mainnet forums
        run: npx hardhat run scripts/reconcile-forums.ts --network base

      - name: Generate deployment artifacts
        run: |
          node ../scripts/generate-deployment-artifacts.mjs base
          node ../scripts/generate-backend-env-examples.mjs

      - name: Commit reconciled deployment state
        run: |
          git config user.name "smart-contract-deployer"
          git config user.email "smart-contract-deployer@symvolia.org"

          git add ../deployments/base.json
          git add ../frontend/src/contracts/networks/base.ts
          git add ../deploy/env/*.env.example

          if git diff --cached --quiet; then
            echo "No Base Mainnet forum reconciliation changes."
          else
            git commit -m "chore: reconcile Base Mainnet forum deployments"
            git push
          fi