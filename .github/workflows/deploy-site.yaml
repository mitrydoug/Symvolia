name: Deploy static site to IPFS

on:
  workflow_run:
    workflows: ["Reconcile smart contracts"]
    types: [completed]
    branches:
      - develop
      - release

  # Allow manual re-runs (e.g. after fixing a Pinata issue)
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and deploy"
        required: false
        default: "release"

permissions:
  contents: write

# Prevent parallel deploys
concurrency:
  group: site-deploy-${{ github.event.workflow_run.head_branch || inputs.branch || 'release' }}
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch || 'release' }}

jobs:
  build:
    # Only deploy the site if the contract deploy succeeded,
    # or if this workflow was triggered manually.
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Configure frontend deployment environment
        run: |
          case "${DEPLOY_BRANCH}" in
            develop) PROFILE=develop ;;
            release) PROFILE=release ;;
            *) echo "Unsupported site deployment branch: ${DEPLOY_BRANCH}"; exit 1 ;;
          esac
          . ../scripts/profile-env.sh
          load_profile_env "${PROFILE}"
          # Profile REQUIRE validated the secrets; persist all VITE_ build vars
          # so the later Build step sees them.
          printenv | grep -E '^VITE_' >> "${GITHUB_ENV}"

      - name: Compute app version
        # workflow_run runs in the default-branch (develop) context, so
        # GITHUB_REF_NAME/GITHUB_SHA point at develop even for release deploys.
        # Pin app-version.mjs to the branch actually being deployed so release
        # builds resolve to the bare `0.1.0` (not `0.1.0-dev.<sha>`).
        env:
          APP_VERSION_REF_NAME: ${{ env.DEPLOY_BRANCH }}
        run: echo "VITE_APP_VERSION=$(node ../scripts/app-version.mjs)" >> "${GITHUB_ENV}"

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  pin-ipfs:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      cid: ${{ steps.pin.outputs.cid }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Pin to IPFS
        id: pin
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
        run: npx tsx scripts/pin-to-ipfs.ts dist

  deploy-worker:
    needs: pin-ipfs
    # Deploys the test Worker (test-symvolia → test.symvolia.org), fed by the
    # develop branch. The production site (symvolia.org) is handled by the
    # separate deploy-worker-prod job below, gated to the release branch.
    if: ${{ (github.event.workflow_run.head_branch || inputs.branch || 'release') == 'develop' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker with new CID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e753937da094d1611ac0bc7cf64f008f
          CID: ${{ needs.pin-ipfs.outputs.cid }}
        run: npx wrangler deploy --env test --var IPFS_CID:"$CID"

  deploy-worker-prod:
    needs: pin-ipfs
    # Deploys the production Worker (symvolia → symvolia.org), fed by the
    # release branch. Mirrors deploy-worker but targets the `production`
    # Wrangler environment (see cloudflare-worker/wrangler.jsonc). IPFS_GATEWAY,
    # CSP_MODE, and the symvolia.org custom-domain route come from that env
    # block; only IPFS_CID is overridden per deploy.
    if: ${{ (github.event.workflow_run.head_branch || inputs.branch || 'release') == 'release' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker with new CID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e753937da094d1611ac0bc7cf64f008f
          CID: ${{ needs.pin-ipfs.outputs.cid }}
        run: npx wrangler deploy --env production --var IPFS_CID:"$CID"

  publish-release:
    needs: pin-ipfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CID: ${{ needs.pin-ipfs.outputs.cid }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
          REPO: ${{ github.repository }}
          # See "Compute app version" above: force the deployed branch so the
          # release tag/title match the site build (release -> 0.1.0).
          APP_VERSION_REF_NAME: ${{ env.DEPLOY_BRANCH }}
        run: |
          APP_VERSION="$(node scripts/app-version.mjs)"
          CONTRACT_NOTES="$(node scripts/release-contract-notes.mjs)"
          TAG="v${APP_VERSION}"
          # The checkout above is at DEPLOY_BRANCH head; pin the tag to that
          # exact commit so the release points at the deployed branch head
          # rather than the repo default branch (develop).
          TARGET_SHA="$(git rev-parse HEAD)"
          TITLE="Symvolia ${APP_VERSION}"
          GATEWAY="https://${PINATA_GATEWAY}/ipfs/${CID}"
          PUBLIC="https://ipfs.io/ipfs/${CID}"
          SITE_URL="${PUBLIC}"

          # On the develop branch the build is published to the public test site.
          RELEASE_ARGS=""
          if [ "${DEPLOY_BRANCH}" = "develop" ]; then
            SITE_URL="https://test.symvolia.org/ipfs/${CID}"
            RELEASE_ARGS="--prerelease"
          elif [ "${DEPLOY_BRANCH}" = "release" ]; then
            # The production Worker (deploy-worker-prod) serves this CID at the
            # apex domain, so link releases there rather than the raw gateway.
            SITE_URL="https://symvolia.org"
          fi

          NOTES=$(printf '%s\n' \
            '## Frontend deployed to IPFS' \
            '' \
            "**Version:** ${APP_VERSION}" \
            '' \
            "**IPFS cid:** \`${CID}\`" \
            '' \
            "**Site:** ${SITE_URL}" \
            '' \
            "$CONTRACT_NOTES")

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --target "$TARGET_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              ${RELEASE_ARGS}
          fi
